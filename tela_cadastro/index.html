<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/tela_cadastro/style.css">
</head>
<body>
     <form action="#" method="post">
        <img class = "logo-login"src="/imagens/imagens_cadastro/logo-login.png" alt="">
        <main class="caixa-principal">
       
            <section class="mensagem">
                
                <h2>Criar Conta</h2>
                <p>Comece sua jornada de autoconhecimento.</p>
            </section>
            <section class="dados">
                <label for="email" id="email">Email</label><input type="email" placeholder= "seuemail@.gmail.com">

                <label for="usuario" id="usuario">Nome/Usuario</label><input type="text" placeholder="Seu Nome">
                
                <label for="senha" id="senha">Senha</label><input type="password" placeholder=" &bull; &bull; &bull; &bull; &bull; &bull; &bull;">
            </section>
            <section class="btn-enviar">
                <button type="submit">Cadastrar</button>
            </section>    
        </main>
        <footer>
            <section class="fazer-login">
                <p>Já tem uma conta? <a href="#"> Fazer Login.</a></p>
            </section>
        </footer>    
    <form action="#" method="post"></form>
</body>
</html>
