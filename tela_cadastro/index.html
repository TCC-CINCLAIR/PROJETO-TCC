<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <form action="#" method="post">
        <main class="caixa-principal">
            <section class="mensagem">
                <img src="" alt="">
                <h2>Criar Conta</h2>
                <p>Comece sua jornada de autoconhecimento.</p>
            </section>
            <section class="dados">
                <label for="">Email</label><input type="email" placeholder="seuemail@.gmail.com">

                <label for="">Nome/Usuario</label><input type="text" placeholder="Seu Nome">
                
                <label for="">Senha</label><input type="password" placeholder=" &bull; &bull; &bull; &bull; &bull; &bull; &bull;">
            </section>
            <section class="btn-enviar">
                <button type="submit">Cadastrar</button>
            </section>
            <footer>
                <p>Já tem uma conta?<a href="">Fazer Login.</a></p>
            </footer>
        </main>
    </form>
</body>
</html>
