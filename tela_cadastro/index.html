<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
     <form action="processar_cadastro.php" method="post">
        <img class="logo-login" src="../imagens/imagens_cadastro/logo-login.png" alt="">
        <main class="caixa-principal">
       
            <section class="mensagem">
                
                <h2>Criar Conta</h2>
                <p>Comece sua jornada de autoconhecimento.</p>
            </section>
            <section class="dados">
                <label for="email">Email</label><input type="email" name="email" id="email" placeholder= "seuemail@.gmail.com">

                <label for="usuario">Nome/Usuario</label><input type="text" name="usuario" id="usuario" placeholder="Seu Nome">
                
                <label for="senha">Senha</label><input type="password" name="senha" id="senha" placeholder=" &bull; &bull; &bull; &bull; &bull; &bull; &bull;">
            </section>
            <section class="btn-enviar">
                <button type="submit">Cadastrar</button>
            </section>    
        </main>
        <footer>
            <section class="fazer-login">
                <p>Já tem uma conta? <a href="../tela_login/" target="_self"> Fazer Login.</a></p>
            </section>
        </footer>    
</body>
</html>
