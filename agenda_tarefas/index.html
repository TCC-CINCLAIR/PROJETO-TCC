<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda de Tarefas</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav class="top-menu">

      <a href="" class="menu-btn"><button >Dashboard</button></a>
      <a href="" class="menu-btn"><button >Chatbot</button></a>
      <a href="" class="menu-btn"><button >Perfil</button></a>
      <a href="" class="menu-btn-active"><button >Agenda</button></a>
      <a href="" class="menu-btn"><button >Consultas</button></a>

    </nav>
  </header>

  <main class="container">    
    <div class="agenda-box">

      <div class="top-area">

        <button class="new-task" onclick="openModal()">
          + Nova Tarefa
        </button>

        <div class="title">
          <h1>Agenda de Tarefas</h1>
          <p>Organize suas atividades diárias</p>
        </div>

        <div class="menu-icon" onclick="openMenu()">
          <div></div>
          <div></div>
          <div></div>
        </div>

      </div>

      <div class="tasks-grid" id="tasksContainer">

      </div>

    </div>

  </main>


  <div class="modal" id="taskModal">

    <div class="modal-content">

      <h2>Adicionar Nova Tarefa</h2>

      <div class="form-group">

        <label>Título da tarefa</label>

        <input 
          type="text" 
          id="taskTitle"
          placeholder="Ex: Meditação Matinal"
        >

      </div>

      <div class="form-group">

        <label>Data</label>

        <input 
          type="date"
          id="taskDate"
        >

      </div>

      <div class="modal-buttons">

        <button class="add-btn" onclick="addTask()">
          Adicionar
        </button>

        <button class="cancel-btn" onclick="closeModal()">
          Cancelar
        </button>

      </div>

    </div>

  </div>

  <div class="side-menu" id="sideMenu">

    <div class="side-header">

      <h2>Pendências</h2>

      <button class="close-menu" onclick="closeMenu()">
        ✕
      </button>

    </div>

    <div class="month-item" onclick="toggleMonthTasks('Janeiro')">

  <div class="month-left">

    <div class="pending-dot" id="dot-Janeiro"></div>

    <span>Janeiro</span>

  </div>

  <span>›</span>

</div>

<div class="month-tasks" id="tasks-Janeiro"></div>
