<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta 7 | Cinclair</title>
    <link rel="stylesheet" href="style.css">
    <script src="../script.js" defer></script>
</head>
<body>
    <div class="caixa-questionario">
        <!-- Progresso desta página -->
        <div class="informacoes-progresso">
            <p>Pergunta 7 de 7</p>
            <span>86% completo</span>
        </div>
        <div class="barra-progresso">
            <div class="progresso-6"></div>
        </div>

        <!-- O action informa qual é a próxima página -->
        <form id="questionario" action="../conclusao/index.html">
            <h1 id="titulo-pergunta">Há alguma preferência que você gostaria que o assistente respeitasse?</h1>
            <div class="opcoes" role="group" aria-labelledby="titulo-pergunta">
                <label for="preferencias">Preferências adicionais (opcional)</label>
                <textarea class="campo-texto" id="preferencias" name="preferencias" rows="4" maxlength="1000" placeholder="Ex.: não usar emojis ou usar palavras simples."></textarea>
                <p class="dica">Você pode concluir sem preencher este campo.</p>
            </div>

            <p id="aviso" class="mensagem-erro" role="alert"></p>
            <div class="botoes">
                <a class="btn-voltar" href="../pergunta6/index.html">Voltar</a>
                <button class="btn-proxima" type="submit">Concluir</button>
            </div>
        </form>
        <noscript>Ative o JavaScript para guardar suas respostas ao mudar de página.</noscript>
    </div>
</body>
</html>
